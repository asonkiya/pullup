name: Supabase keepalive

# Free-tier Supabase projects auto-pause after ~7 days without API activity.
# A paused backend means nobody can sign in (the app shows network errors),
# which is fatal during an App Review window. This pings the REST API daily
# so the project always counts as active. Remove once the project is on Pro.
#
# Requires repo secret SUPABASE_ANON_KEY (the public client-side anon key).
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf "https://ciucouvnqetkjvniofba.supabase.co/rest/v1/plans?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -o /dev/null -w "HTTP %{http_code}\n"
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
